[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    \.venv
  | acts
  | project
  | backups
  | exports
  | certificates
  | logs
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".venv", "acts", "project", "backups", "exports", "certificates", "logs",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
